# Memory note (8 GB machine): the frontend is in the "frontend" profile, so
# `make up` skips it. Run it natively with `cd frontend && pnpm dev`, or
# start it in compose with `docker compose --profile frontend up -d frontend`.
#
# Beat, the scheduler, is in the "scheduler" profile, so a plain `make up` does not start it.
# Beat sends a missed daily run as soon as it starts (it keeps its last-run times in a file
# inside its container), so starting it can fetch from arXiv and Hugging Face and call
# OpenAI at once. Start it on purpose with `make up-scheduler`.
#
# Every published port is bound to 127.0.0.1: without a host IP, Docker publishes on
# 0.0.0.0 and the stores (with their default passwords) are reachable from the LAN.

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Inside compose the stores are reached by service name, not localhost.
    DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
  depends_on: &stores-healthy
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Pinned: Qdrant snapshots restore only into a compatible server version, and an
    # unpinned tag moves to a new release on the next pull.
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      # The image has no curl; bash's /dev/tcp opens a socket to send a raw HTTP request.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '200'
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # The reranker's model files, downloaded once on the host by `make fetch-reranker`
      # and mounted read-only; with Hugging Face's offline mode on, the API can never
      # download a model itself. The API loads the model on the first reranked search.
      FASTEMBED_CACHE_DIR: /opt/fastembed
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/fastembed:/opt/fastembed:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app.celery_app worker --concurrency=1 --loglevel=info
    healthcheck:
      # `inspect ping` is heavy-ish, so check every 30s to save RAM/CPU.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    profiles: ["scheduler"]
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    healthcheck:
      # Beat answers no remote-control pings, and the slim image has no pgrep:
      # healthy while PID 1 (the container's command) is still the beat process.
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline','rb').read() else 1)"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  qdrant_data:
