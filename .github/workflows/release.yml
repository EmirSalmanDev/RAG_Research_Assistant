name: Release

# Builds the backend and the frontend images for linux/amd64 and linux/arm64 and pushes them
# to the GitHub Container Registry (ghcr.io) when a version tag is pushed:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Images (the repository's name, lower case, as ghcr.io requires):
#     ghcr.io/<owner>/<repo>-backend    the API, the worker and Beat (one image, three commands)
#     ghcr.io/<owner>/<repo>-frontend   the Next.js app
# Tags of each: 1.0.0, 1.0 and latest (a pre-release tag such as v1.0.0-rc.1 gets neither
# 1.0 nor latest). No secret is needed: the job's own GITHUB_TOKEN may write packages.
#
# The arm64 image is built on this amd64 runner under QEMU, which is slow (the dependency
# install runs emulated) but needs nothing else. GitHub's arm64 runners would build it
# natively; they are not used because they are not available to every private repository.
# The base images in backend/Dockerfile are pinned by digest: the digest must be the
# multi-platform index, or the amd64/arm64 build fails on the other platform
# (`docker buildx imagetools inspect <image>@<digest>` lists the platforms).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  # A tag can be pushed from any branch. Images are only published for a commit that is on
  # main, which is the commit CI has checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; merge first, then tag the merge commit"
            exit 1
          fi

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The action lower-cases the image name (ghcr.io rejects upper case).
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto: the semver tags above also set `latest`, except for pre-releases.
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A plain manifest list: the default provenance attestation adds an
          # "unknown/unknown" entry that confuses some tools listing the platforms.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
