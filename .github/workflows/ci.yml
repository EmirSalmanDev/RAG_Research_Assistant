name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Where tiktoken keeps its tokenizer file. Same directory app/ingest/tokens.py uses
      # by default (~/.cache/tiktoken); set explicitly so the cache step below matches.
      TIKTOKEN_CACHE_DIR: /home/runner/.cache/tiktoken
    # Service containers: integration tests use these (same URLs as the defaults in
    # app/config.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s
          --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant
        ports: ["6333:6333"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.21"  # same uv as the Docker image and local development
      - run: uv sync --locked
      # The chunking tests need tiktoken's cl100k_base file, but pytest blocks the network.
      # So it is fetched here, before pytest, and kept in the Actions cache. The key is the
      # file's name in the cache directory (tiktoken names it by the SHA-1 of its URL), so
      # it is downloaded only when the cache is empty.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/tiktoken
          key: tiktoken-9b5ad71b2ce5302211f9c61530b329a4922fc6a4
      - name: Pre-fetch the tokenizer (no-op when cached)
        run: uv run python -c "from app.ingest.tokens import get_encoding; print(get_encoding().name)"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app eval tests
      # The Qdrant image has no curl, so its service container has no healthcheck; wait
      # here (the runner has curl) until it answers /readyz. BM25 needs no download step:
      # its stopword list is committed in app/ingest/data/.
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in 30 s" >&2
          exit 1
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
