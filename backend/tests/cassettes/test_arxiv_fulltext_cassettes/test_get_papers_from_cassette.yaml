        \   <author>\n      <name>Aidan N. Gomez</name>\n    </author>\n    <author>\n
        \     <name>Lukasz Kaiser</name>\n    </author>\n    <author>\n      <name>Illia
        Polosukhin</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1301.3781v3</id>\n
        \   <title>Efficient Estimation of Word Representations in Vector Space</title>\n
        \   <updated>2013-09-07T00:30:40Z</updated>\n    <link href=\"https://arxiv.org/abs/1301.3781v3\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/1301.3781v3\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>We
        propose two novel model architectures for computing continuous vector representations
        of words from very large data sets. The quality of these representations is
        measured in a word similarity task, and the results are compared to the previously
        best performing techniques based on different types of neural networks. We
        observe large improvements in accuracy at much lower computational cost, i.e.
        it takes less than a day to learn high quality word vectors from a 1.6 billion
        words data set. Furthermore, we show that these vectors provide state-of-the-art
        performance on our test set for measuring syntactic and semantic word similarities.</summary>\n
        \   <category term=\"cs.CL\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2013-01-16T18:24:43Z</published>\n    <arxiv:primary_category
        term=\"cs.CL\"/>\n    <author>\n      <name>Tomas Mikolov</name>\n    </author>\n
        \   <author>\n      <name>Kai Chen</name>\n    </author>\n    <author>\n      <name>Greg
        Corrado</name>\n    </author>\n    <author>\n      <name>Jeffrey Dean</name>\n
        \   </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2609.24972v2</id>\n
        \   <title>RRSI: Regularized Recursive Self-Improvement of Agent Harnesses</title>\n
        \   <updated>2026-09-23T22:10:39Z</updated>\n    <link href=\"https://arxiv.org/abs/2609.24972v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2609.24972v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>An
        LLM agent's capability is largely magnified by its harness, namely the prompts,
        control flow, tooling, memory, and context management surrounding the frozen
        backbone model. Recent methods increasingly automate this process by iteratively
        proposing and selecting component-wise edits of an agent harness, practically
        establishing a form of recursive self-improvement (RSI) at the agent-system
        level. However, such recursive evolution may overfit by memorizing the training
        tasks, showing large in-distribution gains that shrink or even vanish on out-of-distribution
        benchmarks. We introduce Regularized Recursive Self-Improvement of Agent Harnesses
        (RRSI), which incorporates the principles of regularizations into harness
        self-improvement by constraining the evolution candidate proposal and selection.
        The proposer operates with a temporally annealed budget, limiting how many
        edits a candidate can bundle, and it encourages unexplored trajectories based
        on evolution history. The selector is equipped with a critic and a pruner:
        the critic screens benchmark-specific proposals, while the pruner, removes
        changes that are too small, too expensive, or no longer useful. Together these
        constraints favor reusable agent mechanisms over benchmark-specific ones or
        even noises. Across eight benchmarks spanning coding, agentic workspace and
        engineering design tasks, RRSI gains up to 14.1 points on the split it evolves
        against and up to 4.7 points on the five out-of-distribution benchmarks, while
        producing a harness that runs on 30% fewer policy tokens than the unregularized
        evolution. Code is available at https://github.com/google-research/rrsi and
        project page is https://regularized-rsi.com/.</summary>\n    <category term=\"cs.LG\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
