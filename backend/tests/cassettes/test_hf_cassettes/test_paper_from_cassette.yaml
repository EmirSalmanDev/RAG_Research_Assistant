        "Attention Is All You Need", "summary": "The dominant sequence transduction
        models are based on complex recurrent or\nconvolutional neural networks in
        an encoder-decoder configuration. The best\nperforming models also connect
        the encoder and decoder through an attention\nmechanism. We propose a new
        simple network architecture, the Transformer, based\nsolely on attention mechanisms,
        dispensing with recurrence and convolutions\nentirely. Experiments on two
        machine translation tasks show these models to be\nsuperior in quality while
        being more parallelizable and requiring significantly\nless time to train.
