[project]
name = "research-copilot-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.0",
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.6,<4.16",
    "openai>=3.22.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "arxiv.*", "vcr.*", "pymupdf4llm.*"]
ignore_missing_imports = true

# Celery ships no type hints, so its task decorators are untyped.
[[tool.mypy.overrides]]
module = ["app.ingest.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests must pass with the network OFF: real outbound calls raise, only the local
# stack (Postgres/Redis) is reachable, and cassettes are replayed, never recorded.
addopts = "--block-network --allowed-hosts=localhost,127.0.0.1,::1 --record-mode=none"
markers = ["integration: needs the local Postgres/Redis from `make up` (service containers in CI)"]
filterwarnings = [
    # PyMuPDF's SWIG bindings warn on import under Python 3.12; not actionable here.
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
